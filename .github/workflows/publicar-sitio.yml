name: Publicar sitio JBM ARQUITECTOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar y activar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='tools' \
            ./ _site/
          python tools/apply_jbm_21.py
          python tools/apply_estimator.py
          python3 - <<'PY'
          from pathlib import Path
          import os

          version = os.environ.get('GITHUB_SHA', 'jbm')[:10]

          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<title>JBM ARQUITECTOS | Arquitectura e interiorismo en Guanajuato</title>',
              '<title>JBM ARQUITECTOS | Arquitectura contemporánea</title>'
          )
          s = s.replace(
              'href="favicon-jbm.svg" rel="icon" type="image/svg+xml"',
              'href="favicon-jbm.svg?v=20260804-3" rel="icon" type="image/svg+xml" sizes="any"'
          )
          s = s.replace(
              'href="favicon.png" rel="icon"',
              'href="favicon-jbm.svg?v=20260804-3" rel="icon" type="image/svg+xml" sizes="any"'
          )
          s = s.replace('assets/css/estimador.css', f'assets/css/estimador.css?v={version}')
          s = s.replace('assets/js/estimador.js', f'assets/js/estimador.js?v={version}')
          p.write_text(s, encoding='utf-8')

          analytics_tag = f'<script src="assets/js/analytics.js?v={version}"></script>'
          for page in Path('_site').glob('*.html'):
              html = page.read_text(encoding='utf-8')
              if 'assets/js/analytics.js' not in html:
                  html = html.replace('</body>', analytics_tag + '\n</body>', 1)
                  page.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
